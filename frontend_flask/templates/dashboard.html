<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Green Moving</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
        .bike-card { background: white; padding: 1.5rem; border-radius: 12px; border-left: 5px solid #2ecc71; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .bike-id { font-weight: bold; font-size: 1.2rem; color: #27ae60; }
        .info { margin: 10px 0; color: #555; }
        .price { font-size: 1.5rem; color: #2c3e50; font-weight: bold; }
        .rent-btn { background: #2ecc71; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .rent-btn:hover { background: #27ae60; }
    </style>
</head>
<body>
    <div style="max-width: 1000px; margin: 0 auto;">
        <header style="text-align: center; margin-top: 30px;">
            <h1>🚲 Bici Disponibili</h1>
            <p>Scegli la tua e-bike e parti!</p>
        </header>

        <div class="grid">
            {% for bike in bikes %}
            <div class="bike-card">
                <div class="bike-id">Bike ID: {{ bike.id }}</div>
                <div class="info">⏳ Autonomia: <strong>{{ bike.minutes }} min</strong></div>
                <div class="price">€ {{ bike.price }}</div>
                <a href="{{ url_for('reserve_bike', bike_id=bike.id) }}" class="rent-btn">
                    Prenota Ora
                </a>
            </div>
            {% else %}
            <p style="text-align: center; grid-column: 1 / -1;">Al momento non ci sono bici cariche in zona.</p>
            {% endfor %}
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="/login" style="color: #7f8c8d;">Esci dal profilo</a>
        </div>
    </div>
</body>
</html>
